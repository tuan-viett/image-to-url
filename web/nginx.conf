# Included from /etc/nginx/nginx.conf via /etc/nginx/conf.d/app.conf
# This file lives inside the http {} block of the main nginx.conf, so only
# http/server/location context directives are valid here.

server {
  listen 80 default_server;
  server_name _;

  # Allow larger multipart uploads than the default 1MB
  client_max_body_size 25m;

  # Serve public images straight from the shared storage volume.
  # This is the layer exposed to the internet as PUBLIC_IMAGE_BASE_URL.
  location /i/ {
    alias /usr/share/nginx/html/i/;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
    try_files $uri =404;
  }

  # Proxy API requests to the FastAPI service.
  location /api/ {
    proxy_pass         http://api:8000;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # Everything else is the static web app.
  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri $uri/ /index.html;
  }

  # Tighter gzip for static assets / API JSON
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml;
}