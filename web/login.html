<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — ImageURL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <a class="brand" href="/">Image<span>URL</span></a>
  <h1>Welcome back</h1>
  <p class="muted">Sign in to your account.</p>

  <form id="loginForm" class="auth-form">
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password" minlength="8">
    </label>
    <button type="submit" class="btn-primary w-full">Login</button>
    <div id="err" class="err"></div>
  </form>

  <div class="auth-foot">
    New here? <a href="/register.html">Create an account</a>
  </div>
  <div class="hint">Demo: <code>demo@example.com</code> / <code>Demo123!</code></div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>initLoginPage();</script>
</body>
</html>
